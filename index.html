<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NyE | ISO/IEC 27001</title>
  <link rel="stylesheet" href="css/index.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <a class="logo" href="index.html"><img src="css/img/logo.png" alt="NyE, ir al inicio"></a>
    <nav>
      <a href="saber-mas.html">Saber más</a>
      <a href="preguntas-frecuentes.html">Preguntas frecuentes</a>
      <a href="contacto.html">Contáctanos</a>
    </nav>
  </header>

  <main>
    <section class="imagen">
      <img src="css/img/candado.jpg" alt="Candado digital sobre una red de puntos conectados">
    </section>

    <aside>
      <h1>Infórmate de este mundo digital,<br>y sé parte de este futuro</h1>

      <section class="login">
        <h2>¿Ya tienes una cuenta?</h2>
        <form action="#" method="post">
          <div class="campo">
            <label for="usuario">Usuario o correo electrónico</label>
            <input type="text" id="usuario" name="usuario" placeholder="Pon tu usuario o correo electrónico">
          </div>
          <div class="campo">
            <label for="clave">Contraseña</label>
            <input type="password" id="clave" name="clave" placeholder="Ingresa tu contraseña">
          </div>
          <button type="submit">Ingresar</button>
        </form>
      </section>

      <section class="registro">
        <p>¿No tienes una cuenta aún?</p>
        <a href="registro.html">Regístrate</a>
      </section>
    </aside>
  </main>
</body>
</html>
