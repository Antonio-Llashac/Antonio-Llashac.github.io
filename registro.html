<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regístrate | ISO/IEC 27001</title>
  <link rel="stylesheet" href="css/registro.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <a class="logo" href="index.html"><img src="css/img/logo.png" alt="NyE, ir al inicio"></a>
    <nav>
      <a href="saber-mas.html">Saber más</a>
      <a href="preguntas-frecuentes.html">Preguntas frecuentes</a>
      <a href="contacto.html">Contáctanos</a>
    </nav>
  </header>

  <main>
    <aside>
      <p>ya tienes una cuenta, loguéate</p>
      <a href="index.html">Loguearse</a>
    </aside>

    <section>
      <h1>Regístrate</h1>

      <div class="redes">
        <button type="button" aria-label="Registrarse con Facebook"><img src="css/img/facebook.png" alt=""></button>
        <button type="button" aria-label="Registrarse con Gmail"><img src="css/img/gmail.png" alt=""></button>
        <button type="button" aria-label="Registrarse con LinkedIn"><img src="css/img/link.png" alt=""></button>
      </div>
      <p>usa otras cuentas para registrarte</p>

      <form action="#" method="post">
        <div>
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" required>
        </div>

        <div>
          <label for="correo">Correo</label>
          <input type="email" id="correo" name="correo" required>
        </div>

        <div>
          <label for="clave">Contraseña</label>
          <input type="password" id="clave" name="clave" required>
        </div>

        <button type="submit">Registrarse</button>
      </form>
    </section>
  </main>
</body>
</html>
